
name: Build Router Admin APK

on:
  push:
    paths:
      - 'RouterAdmin_Limon_Starter_Complete.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o RouterAdmin_Limon_Starter_Complete.zip -d extracted
          cp -R extracted/. .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RouterAdmin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
